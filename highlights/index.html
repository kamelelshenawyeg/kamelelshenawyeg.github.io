*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
:root{--barh:calc(35px + env(safe-area-inset-bottom,0px));--headh:calc(56px + env(safe-area-inset-top,0px))}
#ghead{position:fixed;top:0;left:0;right:0;z-index:11;display:flex;align-items:center;justify-content:space-between;height:var(--headh);box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;background:#0d0c09;border-bottom:1px solid rgb(245 241 230/.12)}
#ghead .ttl{font-size:19px;letter-spacing:.02em}
#ghead .pill svg{width:15px;height:15px}
#gclose{font-size:12px;letter-spacing:.03em;gap:.35rem;padding:.5rem .8rem;border-color:rgb(245 241 230/.3);background:rgb(20 19 15/.45);text-decoration:none}

body.viewing #ghead{display:none}
#brands{position:fixed;top:var(--headh);left:0;right:0;z-index:11;background:#0d0c09;border-bottom:1px solid rgb(245 241 230/.08)}
body.viewing #brands{display:none}
body{background:#0d0c09;color:#f5f1e6;font-family:Georgia,'Times New Roman',serif;overscroll-behavior:none}
/* ---------- viewer top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:none;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(rgb(13 12 9/.85),transparent)}
body.viewing .bar{display:flex}
.pill{display:inline-flex;align-items:center;gap:.4rem;font:inherit;font-size:12.5px;line-height:1;padding:.55rem .85rem;border-radius:999px;border:1px solid rgb(245 241 230/.45);background:rgb(20 19 15/.72);color:#f5f1e6;cursor:pointer}
.pill svg{width:15px;height:15px}
/* ---------- gallery ---------- */
#gallery{position:fixed;inset:0;overflow-y:auto;background:#0d0c09;padding-top:calc(var(--headh) + 45px);padding-bottom:var(--barh);columns:2;column-gap:0}
body.viewing #gallery{display:none}
.tile{display:block;width:100%;border:0;padding:0;background:#14130f;cursor:pointer;break-inside:avoid;position:relative}
.tile video,.tile img{display:block;width:100%;height:auto}
.tile .tn{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:11px;letter-spacing:.03em;text-align:left;color:#f5f1e6;background:linear-gradient(transparent,rgb(13 12 9/.8))}
/* ---------- viewer feed ---------- */

body.viewing #viewer{display:block}
.feed{height:calc(100dvh - var(--barh));overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.reel{position:relative;height:calc(100dvh - var(--barh));scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0d0c09}
.reel:fullscreen{height:100dvh}
.reel video{width:100%;height:100%;object-fit:contain}
.reel video[data-fit="contain"]{object-fit:contain}
.ctl{position:absolute;right:12px;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid rgb(245 241 230/.4);background:rgb(20 19 15/.72);color:#f5f1e6;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sound{top:calc(64px + env(safe-area-inset-top))}
.expand{top:calc(118px + env(safe-area-inset-top));font-size:15px}
.glyph{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgb(20 19 15/.72);color:#f5f1e6;display:none;align-items:center;justify-content:center;pointer-events:none}
.glyph svg{width:26px;height:26px}
.dbar button svg{width:16px;height:16px;display:block;margin:auto}
.reel.is-paused .glyph{display:flex}
.reel.loading::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid rgb(245 241 230/.25);border-top-color:#f5f1e6;animation:hlspin 1s linear infinite;pointer-events:none}
@keyframes hlspin{to{transform:rotate(360deg)}}

.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:31;width:min(340px,86vw);background:#f5f1e6;color:#181713;transform:translateX(-102%);transition:transform .24s ease;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dbar{display:flex;align-items:center;justify-content:space-between;padding:calc(.9rem + env(safe-area-inset-top)) 1rem .9rem;border-bottom:1px solid rgb(24 23 19/.2);font-size:19px}

.dlist{overflow-y:auto;display:flex;flex-direction:column}
.ditem{display:flex;gap:.7rem;align-items:center;text-align:left;font:inherit;background:transparent;border:0;border-bottom:1px solid rgb(24 23 19/.14);padding:.7rem .9rem;cursor:pointer;color:inherit}

#brands{display:flex;align-items:center;gap:8px;overflow-x:auto;height:44px;box-sizing:border-box;padding:0 14px;scrollbar-width:none}

  var k=reels.findIndex(function(R){return R.id===i;});if(k<0)k=0;
  if(history.state&&history.state.v){history.replaceState({v:1},'');}else{history.pushState({v:1},'');}
  setTimeout(function(){reels[k].el.scrollIntoView({behavior:'instant' in Element.prototype?'instant':'auto'});feed.scrollTop=reels[k].el.offsetTop;activate(k);},30);
}
function closeViewer(){
  if(document.fullscreenElement)document.exitFullscreen();
  reels.forEach(function(R){if(!R.vid.paused)R.vid.pause();});
  closeD();
  document.body.classList.remove('viewing');
  buildGallery();
}
document.getElementById('closev').addEventListener('click',function(){
  if(history.state&&history.state.v){history.back();}else{closeViewer();}
});
window.addEventListener('popstate',function(){if(document.body.classList.contains('viewing'))closeViewer();});
/* ---------- drawer open/close ---------- */
function openD(){drawer.classList.add('on');scrim.classList.add('on');pl.setAttribute('aria-expanded','true');}
function closeD(){drawer.classList.remove('on');scrim.classList.remove('on');pl.setAttribute('aria-expanded','false');}
pl.addEventListener('click',openD);
document.getElementById('dclose').addEventListener('click',closeD);
scrim.addEventListener('click',closeD);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeD();});
/* ---------- brands ---------- */
(function(){
  var brands=['All'];
  META.forEach(function(v){if(brands.indexOf(v.b)<0)brands.push(v.b);});
  brands.forEach(function(name){
    var b=document.createElement('button');b.type='button';b.className='brand';b.textContent=name;
    b.setAttribute('aria-pressed',name==='All'?'true':'false');
    b.addEventListener('click',function(){
      brandFilter=name==='All'?null:name;
      [].forEach.call(brandsNav.children,function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});
      buildGallery();
      if(document.body.classList.contains('viewing')){
        var cur=currentIdx();var curId=cur>=0?reels[cur].id:-1;
        buildFeed();
        var k=reels.findIndex(function(R){return R.id===curId;});
        var target=k>=0?k:0;
        if(reels.length){feed.scrollTop=reels[target].el.offsetTop;activate(target);}
      }
    });
    brandsNav.appendChild(b);
  });
})();
buildGallery();
</script></body></html>

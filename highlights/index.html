body{background:#0d0c09;color:#f5f1e6;font-family:Georgia,'Times New Roman',serif;overscroll-behavior:none}
/* ---------- viewer top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:none;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(rgb(13 12 9/.85),transparent)}
body.viewing .bar{display:flex}
.pill{display:inline-flex;align-items:center;gap:.4rem;font:inherit;font-size:12.5px;line-height:1;padding:.55rem .85rem;border-radius:999px;border:1px solid rgb(245 241 230/.45);background:rgb(20 19 15/.72);color:#f5f1e6;cursor:pointer}

.tile{display:block;width:100%;border:0;padding:0;background:#14130f;cursor:pointer;break-inside:avoid;position:relative}
.tile video,.tile img{display:block;width:100%;height:auto}
.tile .tn{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:11px;letter-spacing:.03em;text-align:left;color:#f5f1e6;background:linear-gradient(transparent,rgb(13 12 9/.8))}

.reel video{width:100%;height:100%;object-fit:contain}

.sound{top:calc(64px + env(safe-area-inset-top))}

.dbar button svg{width:16px;height:16px;display:block;margin:auto}

var SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>';
var SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
function buildFeed(){
  feed.innerHTML='';reels=[];
  filtered().forEach(function(i){
    var v=META[i];
    var r=document.createElement('div');r.className='reel';
    var vid=document.createElement('video');
    vid.muted=false;vid.loop=true;vid.playsInline=true;vid.setAttribute('playsinline','');vid.preload='auto';
    var tp=thumb(i);if(tp)vid.poster=tp;
    var cd=window.HL[i];if(clipState[i]===2&&cd)vid.src=cd.s;
    if(v.f)vid.setAttribute('data-fit',v.f);
    var g=document.createElement('span');g.className='glyph';g.innerHTML=PLAY_SVG;
    var snd=document.createElement('button');snd.className='ctl sound';snd.type='button';snd.innerHTML=SPK_ON;snd.setAttribute('aria-label','Mute');
    var ex=document.createElement('button');ex.className='ctl expand';ex.type='button';ex.innerHTML=EXP_SVG;ex.setAttribute('aria-label','Fullscreen');
    r.appendChild(vid);r.appendChild(g);r.appendChild(snd);r.appendChild(ex);feed.appendChild(r);
    function rf(){r.classList.toggle('is-paused',vid.paused);snd.innerHTML=vid.muted?SPK_OFF:SPK_ON;snd.setAttribute('aria-label',vid.muted?'Unmute':'Mute');}
    vid.addEventListener('click',function(){if(vid.paused){delete vid.dataset.up;var p=vid.play();if(p&&p.catch)p.catch(function(){});}else{vid.dataset.up='1';vid.pause();}});
    vid.addEventListener('play',rf);vid.addEventListener('playing',rf);vid.addEventListener('pause',rf);document.addEventListener('fullscreenchange',rf);
    vid.addEventListener('playing',function(){r.classList.remove('loading');});
    snd.addEventListener('click',function(){vid.muted=!vid.muted;if(vid.paused&&clipState[i]===2){var p=vid.play();if(p&&p.catch)p.catch(function(){});}rf();});
    ex.addEventListener('click',function(){
      if(document.fullscreenElement){document.exitFullscreen();return;}
      if(r.requestFullscreen){var p=r.requestFullscreen();if(p&&p.catch)p.catch(function(){ if(vid.webkitEnterFullscreen)vid.webkitEnterFullscreen();});}
      else if(vid.webkitEnterFullscreen){vid.webkitEnterFullscreen();}
    });
    rf();
    reels.push({id:i,el:r,vid:vid,rf:rf});
  });
  buildDrawer();
}
/* ---------- playlist drawer ---------- */
var items=[];
function buildDrawer(){
  var dl=document.getElementById('dlist');dl.innerHTML='';items=[];
  reels.forEach(function(R,k){
    var v=META[R.id];
    var b=document.createElement('button');b.type='button';b.className='ditem';b.setAttribute('aria-current',k===0?'true':'false');
    var img=document.createElement('img');var t0=thumb(R.id);if(t0)img.src=t0;img.alt='';
    var tx=document.createElement('span');var t=document.createElement('b');t.textContent=v.t;var m=document.createElement('span');m.textContent=v.b+' \u00B7 '+v.d;
    tx.appendChild(t);tx.appendChild(m);b.appendChild(img);b.appendChild(tx);
    b.addEventListener('click',function(){closeD();R.el.scrollIntoView({behavior:'smooth'});activate(k);});
    dl.appendChild(b);items.push(b);
  });
}
window.__setThumbs=function(){
  buildGallery();
  reels.forEach(function(R){if(!R.vid.getAttribute('poster')){var t=thumb(R.id);if(t)R.vid.poster=t;}});
};
/* ---------- playback ---------- */
function mark(k){items.forEach(function(b,j){b.setAttribute('aria-current',j===k?'true':'false');});}
function ensureClip(i){
  if(clipState[i]!==0)return;
  clipState[i]=1;
  var s=document.createElement('script');s.src='v'+(i+1)+'.js?v=4';
  s.onload=function(){
    clipState[i]=2;
    var d=window.HL[i];if(!d)return;
    reels.forEach(function(R){if(R.id===i){if(R.vid.getAttribute('src')!==d.s)R.vid.src=d.s;if(!R.vid.getAttribute('poster')&&d.p)R.vid.poster=d.p;}});
    var k=currentIdx();if(k>=0&&reels[k].id===i)activate(k);
    prefetchNext();
  };
  s.onerror=function(){clipState[i]=0;reels.forEach(function(R){if(R.id===i)R.el.classList.remove('loading');});};
  document.body.appendChild(s);
}
function tryPlay(R){
  var p=R.vid.play();
  if(p&&p.catch)p.catch(function(){
    if(!R.vid.muted){R.vid.muted=true;R.rf();var p2=R.vid.play();if(p2&&p2.catch)p2.catch(function(){});}
  });
}
function prefetchNext(){
  if(!document.body.classList.contains('viewing'))return;
  for(var n=0;n<reels.length;n++){if(clipState[reels[n].id]===0){ensureClip(reels[n].id);return;}}
}
function activate(k){
  if(k<0||!reels.length)return;
  mark(k);
  reels.forEach(function(R,j){
    if(j===k){
      if(clipState[R.id]===2){var d2=window.HL[R.id];if(d2&&R.vid.getAttribute('src')!==d2.s)R.vid.src=d2.s;R.el.classList.remove('loading');if(R.vid.paused&&!R.vid.dataset.up)tryPlay(R);}
      else{ensureClip(R.id);if(!R.vid.paused)R.vid.pause();if(!R.vid.dataset.up)R.el.classList.add('loading');}
    }else if(!R.vid.paused){R.vid.pause();delete R.vid.dataset.up;}
  });
}
var settle=null;
function currentIdx(){
  if(!reels.length)return -1;
  var mid=window.innerHeight/2,best=0,bd=1e9;
  reels.forEach(function(R,i){var b=R.el.getBoundingClientRect();var c=b.top+b.height/2;var d=Math.abs(c-mid);if(d<bd){bd=d;best=i;}});
  return best;
}
feed.addEventListener('scroll',function(){
  clearTimeout(settle);
  settle=setTimeout(function(){activate(currentIdx());},120);
},{passive:true});
/* ---------- view switching ---------- */
function openViewer(i){
  buildFeed();
  document.body.classList.add('viewing');
  var k=reels.findIndex(function(R){return R.id===i;});if(k<0)k=0;
  if(history.state&&history.state.v){history.replaceState({v:1},'');}else{history.pushState({v:1},'');}
  setTimeout(function(){reels[k].el.scrollIntoView({behavior:'instant' in Element.prototype?'instant':'auto'});feed.scrollTop=reels[k].el.offsetTop;activate(k);},30);
}
function closeViewer(){
  if(document.fullscreenElement)document.exitFullscreen();
  reels.forEach(function(R){if(!R.vid.paused)R.vid.pause();});
  closeD();
  document.body.classList.remove('viewing');
  buildGallery();
}
document.getElementById('closev').addEventListener('click',function(){
  if(history.state&&history.state.v){history.back();}else{closeViewer();}
});
window.addEventListener('popstate',function(){if(document.body.classList.contains('viewing'))closeViewer();});
/* ---------- drawer open/close ---------- */
function openD(){drawer.classList.add('on');scrim.classList.add('on');pl.setAttribute('aria-expanded','true');}
function closeD(){drawer.classList.remove('on');scrim.classList.remove('on');pl.setAttribute('aria-expanded','false');}
pl.addEventListener('click',openD);
document.getElementById('dclose').addEventListener('click',closeD);
scrim.addEventListener('click',closeD);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeD();});
/* ---------- brands ---------- */
(function(){
  var brands=['All'];
  META.forEach(function(v){if(brands.indexOf(v.b)<0)brands.push(v.b);});
  brands.forEach(function(name){
    var b=document.createElement('button');b.type='button';b.className='brand';b.textContent=name;
    b.setAttribute('aria-pressed',name==='All'?'true':'false');
    b.addEventListener('click',function(){
      brandFilter=name==='All'?null:name;
      [].forEach.call(brandsNav.children,function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});
      buildGallery();
      if(document.body.classList.contains('viewing')){
        var cur=currentIdx();var curId=cur>=0?reels[cur].id:-1;
        buildFeed();
        var k=reels.findIndex(function(R){return R.id===curId;});
        var target=k>=0?k:0;
        if(reels.length){feed.scrollTop=reels[target].el.offsetTop;activate(target);}
      }
    });
    brandsNav.appendChild(b);
  });
})();
buildGallery();
</script></body></html>
